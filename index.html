<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Finance Tracker</title>
<!-- Finance Tracker Mini App (Telegram), hosted on GitHub Pages: UI only, no data in this file.
     Data comes from the owner's Apps Script web app (URL passed by the bot in ?api=), and every call
     carries Telegram's signed initData, verified server-side as the owner. Test version 2026-10-12. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #1c1c1e);
    --text: var(--tg-theme-text-color, #ffffff);
    --hint: var(--tg-theme-hint-color, #9a95a6);
    --field: var(--tg-theme-secondary-bg-color, #2c2c2e);
    --accent: var(--tg-theme-button-color, #3e88f7);
  }
  body { margin: 0; padding: 14px 14px 90px; background: var(--bg); color: var(--text);
         font: 15px -apple-system, system-ui, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 2px; }
  .hint { color: var(--hint); font-size: 13px; margin: 2px 0 12px; }
  .label { color: var(--hint); font-size: 13px; margin: 14px 0 6px; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .tile { background: var(--field); border: 2px solid transparent; border-radius: 12px; padding: 10px 4px 8px;
          text-align: center; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
  .tile.on { border-color: var(--accent); }
  .ic { width: 24px; height: 24px; margin: 0 auto 5px; background: currentColor;
        -webkit-mask: var(--icon) center / contain no-repeat; mask: var(--icon) center / contain no-repeat; }
  .en { font-size: 12.5px; font-weight: 600; line-height: 1.2; }
  .vi { font-size: 11.5px; color: var(--hint); line-height: 1.2; margin-top: 1px; }
  textarea { width: 100%; box-sizing: border-box; background: var(--field); color: var(--text); border: 0;
             border-radius: 12px; padding: 10px 12px; font: inherit; min-height: 64px; resize: none; }
  #msg { margin-top: 14px; font-size: 14px; line-height: 1.5; }
  .ok { color: #4cd964; } .bad { color: #ff6b6b; }
</style>
</head>
<body>
<h1>Test form · Thử form</h1>
<div class="hint" id="status">Loading · Đang tải…</div>
<div class="grid" id="grid"></div>
<div class="label">Note · Ghi chú</div>
<textarea id="note" placeholder="e.g. lunch with Nam · vd: ăn trưa với Nam"></textarea>
<div id="msg"></div>
<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  var ICON = 'https://cdn.jsdelivr.net/npm/@tabler/icons@3.19.0/icons/outline/';
  var ICONS = { 'Salary': 'cash', 'Other Income': 'circle-plus', 'Housing': 'home', 'Food & Dining': 'tools-kitchen-2',
    'Transportation': 'motorbike', 'Work': 'briefcase', 'Essentials': 'basket', 'Shopping': 'shopping-bag',
    'Entertainment': 'device-gamepad-2', 'Family': 'users', 'Miscellaneous': 'help-circle', 'Lending': 'heart-handshake',
    'Debt Collection': 'circle-arrow-down', 'Borrowing': 'hand-stop', 'Repayment': 'credit-card',
    'Savings Deposit': 'building-bank', 'Savings Withdrawal': 'pig-money' };
  var params = new URLSearchParams(location.search), api = params.get('api') || '';
  var status = document.getElementById('status'), grid = document.getElementById('grid'), msg = document.getElementById('msg');
  var selected = '';

  function say(el, html, cls) { el.innerHTML = html; el.className = cls || (el === status ? 'hint' : ''); }
  function secs() { return (performance.now() / 1000).toFixed(1); }

  // JSONP (a script tag) instead of fetch: Telegram on iPhone (WebKit) rejects the cross-origin
  // redirect Google puts in front of Apps Script responses ("Load failed"); script tags are not affected.
  var seq = 0;
  function call(payload) {
    payload.initData = tg ? tg.initData : '';
    return new Promise(function (resolve, reject) {
      var name = '__ft' + Date.now() + '_' + (seq++), s = document.createElement('script');
      var done = function () { delete window[name]; s.remove(); clearTimeout(timer); };
      var timer = setTimeout(function () { done(); reject('timeout'); }, 25000);
      window[name] = function (r) { done(); resolve(r); };
      s.onerror = function () { done(); reject('load error'); };
      s.src = api + (api.indexOf('?') < 0 ? '?' : '&') + 'api=form&cb=' + name + '&p=' + encodeURIComponent(JSON.stringify(payload));
      document.head.appendChild(s);
    });
  }

  function render(cats) {
    cats.filter(function (c) { return c.direction === 'Out'; }).forEach(function (c) {
      var d = document.createElement('div');
      d.className = 'tile';
      d.innerHTML = '<div class="ic" style="--icon:url(' + ICON + (ICONS[c.name] || 'circle') + '.svg)"></div>' +
                    '<div class="en"></div><div class="vi"></div>';
      d.querySelector('.en').textContent = c.name;
      d.querySelector('.vi').textContent = c.vi || '';
      d.onclick = function () {
        selected = c.name;
        [].forEach.call(grid.children, function (x) { x.classList.remove('on'); });
        d.classList.add('on');
        if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
        say(msg, '');
      };
      grid.appendChild(d);
    });
  }

  function save() {
    if (!selected) { say(msg, 'Pick a category first · Chọn một danh mục trước.', 'bad'); return; }
    var t = performance.now();
    tg.MainButton.showProgress();
    call({ action: 'test', category: selected, note: document.getElementById('note').value })
      .then(function (r) {
        tg.MainButton.hideProgress();
        if (!r.ok) { say(msg, '⛔ Refused · Bị từ chối: ' + r.why, 'bad'); return; }
        say(msg, '✓ Saved · Đã lưu — ' + r.name + ' (' + ((performance.now() - t) / 1000).toFixed(1) + ' s)', 'ok');
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        setTimeout(function () { tg.close(); }, 700);   // closes the Mini App (works because this page is top-level)
      })
      .catch(function (e) { tg.MainButton.hideProgress(); say(msg, '⛔ Network error · Lỗi mạng: ' + e, 'bad'); });
  }

  if (!tg || !tg.initData) { say(status, '⚠️ Open it from the bot button · Hãy mở bằng nút trong chat với bot.', 'hint bad'); return; }
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(api)) { say(status, '⚠️ Missing system link · Thiếu link hệ thống.', 'hint bad'); return; }
  tg.ready();
  tg.expand();
  tg.MainButton.setText('Save · Lưu');
  tg.MainButton.onClick(save);
  call({ action: 'categories' })
    .then(function (r) {
      if (!r.ok) { say(status, '⛔ Refused · Bị từ chối: ' + r.why, 'hint bad'); return; }
      say(status, '✓ Verified · Đã xác minh: ' + r.name + ' · opened in · mở trong ' + secs() + ' s');
      render(r.cats);
      tg.MainButton.show();
    })
    .catch(function (e) { say(status, '⛔ Network error · Lỗi mạng: ' + e, 'hint bad'); });
})();
</script>
</body>
</html>
